<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
 <title id="title">Privacy-enhanced federated learning architecture</title>
 <desc id="desc">Organisations keep raw operational data local, protect updates, and a server aggregates only their combination.</desc>
 <defs><style>.box{fill:#fff;stroke:#24577a;stroke-width:2}.privacy{fill:#e9f7ef;stroke:#198754;stroke-width:2}.server{fill:#eaf2ff;stroke:#2457a6;stroke-width:2}.t{font:600 18px Segoe UI,Arial;fill:#172033}.s{font:14px Segoe UI,Arial;fill:#4d5a68}.a{stroke:#56687a;stroke-width:2;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#56687a"/></marker></defs>
 <rect width="1100" height="520" fill="#f7f9fc"/><text x="550" y="38" text-anchor="middle" class="t" font-size="24">Privacy-Enhanced Federated Learning</text>
 <rect class="box" x="45" y="85" width="245" height="120" rx="14"/><text class="t" x="167" y="120" text-anchor="middle">Organisation A</text><text class="s" x="167" y="148" text-anchor="middle">Local operational records</text><text class="s" x="167" y="174" text-anchor="middle">Raw data never leaves</text>
 <rect class="box" x="45" y="245" width="245" height="120" rx="14"/><text class="t" x="167" y="280" text-anchor="middle">Organisation B…N</text><text class="s" x="167" y="308" text-anchor="middle">Non-IID local records</text><text class="s" x="167" y="334" text-anchor="middle">Intermittent availability</text>
 <rect class="privacy" x="390" y="105" width="255" height="235" rx="14"/><text class="t" x="517" y="145" text-anchor="middle">Local privacy pipeline</text><text class="s" x="517" y="180" text-anchor="middle">1. Train local model</text><text class="s" x="517" y="212" text-anchor="middle">2. Clip model update</text><text class="s" x="517" y="244" text-anchor="middle">3. Add Gaussian noise</text><text class="s" x="517" y="276" text-anchor="middle">4. Apply cancelling mask</text><text class="s" x="517" y="315" text-anchor="middle">Only protected updates leave</text>
 <rect class="server" x="755" y="105" width="300" height="235" rx="14"/><text class="t" x="905" y="145" text-anchor="middle">Aggregation server</text><text class="s" x="905" y="184" text-anchor="middle">Receives masked updates</text><text class="s" x="905" y="216" text-anchor="middle">Recovers combined update only</text><text class="s" x="905" y="248" text-anchor="middle">Applies FedAvg</text><text class="s" x="905" y="280" text-anchor="middle">Evaluates accuracy and fairness</text><text class="s" x="905" y="312" text-anchor="middle">Returns updated global model</text>
 <line class="a" x1="290" y1="145" x2="388" y2="180"/><line class="a" x1="290" y1="305" x2="388" y2="270"/><line class="a" x1="645" y1="222" x2="753" y2="222"/><path d="M905 340 C905 440 520 455 250 385" fill="none" class="a"/><text class="s" x="590" y="454" text-anchor="middle">Updated global model — no raw records</text><text class="s" x="550" y="495" text-anchor="middle">Educational simulation: no formal privacy budget or production cryptographic guarantee</text>
</svg>
